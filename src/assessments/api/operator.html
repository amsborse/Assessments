<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #13233a;
    --navy-2: #1c3150;
    --paper: #eef2f5;
    --panel: #ffffff;
    --ink: #16202b;
    --muted: #5b6878;
    --line: #d7dee6;
    --automation: #2f7d6d;
    --awaiting: #c98a12;
    --human: #2d5bd8;
    --ended: #6b7785;
    --danger: #b3261e;
    --radius: 10px;
    --font: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 15px/1.5 var(--font); color: var(--ink); background: var(--paper);
  }
  time, .num { font-variant-numeric: tabular-nums; }
  button, input, select { font: inherit; }
  :focus-visible { outline: 3px solid var(--human); outline-offset: 2px; }

  /* ---------------------------------------------------------------- top bar */
  .topbar {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 12px 24px; background: var(--navy); color: #fff;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  .brand svg { flex: none; }
  .topbar .spacer { flex: 1; }
  .who { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #c6d2e2; }
  .who input {
    width: 170px; padding: 6px 10px; border-radius: 8px; border: 1px solid #36507a;
    background: var(--navy-2); color: #fff;
  }
  .link-state { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #c6d2e2; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--automation); }
  .link-state.down .dot { background: var(--danger); }

  /* ---------------------------------------------------------------- layout */
  .shell { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100% - 58px); }
  @media (max-width: 900px) { .shell { grid-template-columns: 1fr; } }

  .queue { border-right: 1px solid var(--line); background: #f7f9fb; padding: 20px 14px; }
  .queue h2 { margin: 0 10px 12px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .session {
    width: 100%; display: grid; grid-template-columns: 4px 1fr; gap: 12px; text-align: left;
    padding: 12px 12px 12px 0; margin-bottom: 6px; border: 1px solid transparent;
    border-radius: var(--radius); background: transparent; cursor: pointer; color: inherit;
  }
  .session:hover { background: #fff; border-color: var(--line); }
  .session[aria-current="true"] { background: #fff; border-color: #b9c6d4; }
  .session .strip { border-radius: 4px; background: var(--c, var(--ended)); }
  .session .title { font-weight: 600; overflow-wrap: anywhere; }
  .session .meta { font-size: 13px; color: var(--muted); }
  .session .state { font-size: 13px; font-weight: 600; color: var(--c); }
  .empty-queue { margin: 8px 10px; color: var(--muted); font-size: 14px; }

  .detail { padding: 24px 28px 40px; min-width: 0; }
  .empty-detail { max-width: 520px; margin: 12vh auto 0; text-align: center; color: var(--muted); }
  .empty-detail h1 { color: var(--ink); font-size: 22px; margin: 16px 0 6px; }

  /* ---------------------------------------------------------------- control track (the memorable bit) */
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 18px; }
  .head h1 { margin: 0; font-size: 24px; line-height: 1.25; max-width: 40ch; }
  .head .sub { color: var(--muted); font-size: 14px; }
  .track { display: flex; align-items: center; gap: 0; margin: 0 0 20px; padding: 0; list-style: none; }
  .track li {
    display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted);
    padding: 8px 14px; border: 1px solid var(--line); background: var(--panel);
  }
  .track li:first-child { border-radius: 999px 0 0 999px; }
  .track li:last-child { border-radius: 0 999px 999px 0; }
  .track li + li { border-left: 0; }
  .track li .pip { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; }
  .track li.on { color: #fff; background: var(--c); border-color: var(--c); font-weight: 600; }
  .track li.on .pip { background: #fff; border-color: #fff; }
  .track li.done { color: var(--ink); }

  .work { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
  @media (max-width: 1200px) { .work { grid-template-columns: 1fr; } }

  .screen-wrap {
    border: 4px solid var(--c); border-radius: 14px; background: var(--c); overflow: hidden;
    transition: border-color .25s, background-color .25s;
  }
  .screen-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 6px 12px 8px; color: #fff; font-size: 14px; font-weight: 600;
  }
  .screen-bar span:last-child { font-weight: 400; opacity: .9; }
  .screen { display: block; width: 100%; height: auto; background: #fff; }
  .screen.interactive { cursor: crosshair; }
  .ripple {
    position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
    border: 3px solid var(--human); pointer-events: none; animation: ripple .5s ease-out forwards;
  }
  @keyframes ripple { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ripple { animation: none; opacity: .6; } .screen-wrap { transition: none; } }

  .keys { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  /* ---------------------------------------------------------------- side panel */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .panel + .panel { margin-top: 16px; }
  .panel h2 { margin: 0 0 10px; font-size: 16px; }
  .reason { font-size: 17px; font-weight: 600; line-height: 1.4; margin: 0 0 14px; }
  dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; overflow-wrap: anywhere; }
  .recent { margin: 12px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 14px; border-radius: 8px; border: 1px solid #b9c6d4; background: #fff;
    color: var(--ink); font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: #f3f6f9; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--c, var(--human)); border-color: var(--c, var(--human)); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); border-color: #e3b5b1; }
  .btn.wide { width: 100%; }
  .stack { display: grid; gap: 8px; }

  .typer { display: flex; gap: 8px; margin-top: 12px; }
  .typer input, .note {
    flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid #b9c6d4; border-radius: 8px;
  }
  .note { width: 100%; margin: 4px 0 12px; }
  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

  .log { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  .log li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
  .log li:first-child { border-top: 0; }
  .log time { color: var(--muted); }
  .log .src { color: var(--muted); font-size: 12px; }

  .banner {
    margin: 0 0 16px; padding: 10px 14px; border-radius: 8px; font-size: 14px;
    background: #fdecea; color: #7a1a13; border: 1px solid #f1c2bd;
  }
  /* activity feed + outcome colours (same palette as evidence/index.html) */
  .feed { list-style: none; margin: 0; padding: 0; max-height: 380px; overflow: auto; font-size: 14px; }
  .feed li { display: grid; grid-template-columns: 10px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  .feed li:first-child { border-top: 0; }
  .feed .pt { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--t, #9fb0c2); }
  .feed li[data-tone="success"] { --t: #1f7a4d; } .feed li[data-tone="recovered"] { --t: #b7791f; }
  .feed li[data-tone="business"] { --t: #2459c9; } .feed li[data-tone="human"] { --t: #6d4bc4; }
  .feed li[data-tone="danger"] { --t: #b3261e; } .feed li[data-tone="muted"] { --t: #64748b; }
  .feed li[data-tone]:not([data-tone="info"]) span:last-child { color: var(--t); font-weight: 600; }
  .feed-empty { color: var(--muted); font-size: 14px; margin: 0; }
  .outcome { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 999px; font-weight: 600;
    color: #fff; background: var(--c); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <circle cx="13" cy="13" r="11" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="13" cy="13" r="3" fill="#fff"/>
      <path d="M13 2v6M13 18v6M2 13h6M18 13h6" stroke="#fff" stroke-width="2"/>
    </svg>
    Operator Console
  </div>
  <div class="spacer"></div>
  <label class="who">Signed in as <input id="op" value="operator.jane" autocomplete="username"></label>
  <div class="link-state" id="link"><span class="dot"></span><span id="link-text">Connecting…</span></div>
</header>

<div class="shell">
  <nav class="queue" aria-label="Live sessions">
    <h2>Sessions</h2>
    <div id="queue"></div>
  </nav>
  <main class="detail" id="detail" aria-live="polite"></main>
</div>

<script>
const STATES = {
  automation:     { label: "Automation in control", short: "Automation", color: "var(--automation)" },
  awaiting_human: { label: "Waiting for a person",  short: "Needs you",  color: "var(--awaiting)" },
  human:          { label: "You have control",      short: "Operator",   color: "var(--human)" },
  ended:          { label: "Session ended",         short: "Ended",      color: "var(--ended)" },
};
const RESOLUTIONS = {
  resume:    { text: "Hand back and resume", primary: true },
  skip_step: { text: "I did this step, continue" },
  approve:   { text: "Approve and continue", primary: true },
  deny:      { text: "Deny this action", danger: true },
  abort:     { text: "Stop the run", danger: true },
};
const OUTCOMES = {
  succeeded:        { label: "Succeeded",        color: "#1f7a4d" },
  business_outcome: { label: "Business outcome", color: "#2459c9" },
  failed:           { label: "Failed",           color: "#b3261e" },
  rejected:         { label: "Rejected",         color: "#64748b" },
  aborted:          { label: "Stopped",          color: "#64748b" },
};
const KIND = { stuck: "The agent is stuck", escalation: "Needs a person", approval: "Needs your approval" };

const $ = (s, el = document) => el.querySelector(s);
const wrapId = (t) => esc(t).replace(/([._@])/g, "$1<wbr>");
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const op = () => $("#op").value.trim();
let sessions = [], selected = null, pinned = false, lastSig = "", error = "";
const feeds = {}; // session id -> {seq, items}

async function api(path, body) {
  const r = await fetch(path, body
    ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }
    : {});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((data.error && data.error.message) || `Request failed (${r.status})`);
  return data;
}

function stateOf(s) {
  if (s.finished) {
    const o = OUTCOMES[s.status] || { label: "Ended", color: "var(--ended)" };
    return { label: `Finished: ${o.label.toLowerCase()}`, short: o.label, color: o.color };
  }
  return STATES[s.controller] || STATES.ended;
}
function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  return s < 60 ? `${Math.round(s)}s ago` : `${Math.round(s / 60)} min ago`;
}

function renderQueue() {
  const q = $("#queue");
  if (!sessions.length) {
    q.innerHTML = '<p class="empty-queue">No sessions yet. Runs appear here while they are working.</p>';
    return;
  }
  const order = { awaiting_human: 0, human: 1, automation: 2, ended: 3 };
  const sorted = [...sessions].sort((a, b) => order[a.controller] - order[b.controller]
    || new Date(b.started_at) - new Date(a.started_at));
  q.innerHTML = sorted.map((s) => {
    const st = stateOf(s);
    return `<button class="session" style="--c:${st.color}" data-id="${s.id}" aria-current="${s.id === selected}">
      <span class="strip"></span>
      <span><span class="title">${wrapId(s.label)}</span><br>
        <span class="state">${st.short}</span><span class="meta">, ${s.kind} ${s.finished ? `ended ${ago(s.ended_at)}` : `started ${ago(s.started_at)}`}</span></span>
    </button>`;
  }).join("");
}

function track(controller) {
  const steps = [["automation", "Automation"], ["awaiting_human", "Waiting for you"], ["human", "You"]];
  const idx = steps.findIndex(([k]) => k === controller);
  return `<ol class="track" aria-label="Who has control">${steps.map(([k, label], i) =>
    `<li class="${i === idx ? "on" : i < idx ? "done" : ""}" ${i === idx ? 'aria-current="step"' : ""}><span class="pip"></span>${label}</li>`
  ).join("")}</ol>`;
}

function renderDetail() {
  const d = $("#detail");
  const s = sessions.find((x) => x.id === selected);
  if (!s) {
    d.innerHTML = `<div class="empty-detail">
      <svg width="56" height="56" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="#9fb0c2" stroke-width="1.5"/><circle cx="13" cy="13" r="3" fill="#9fb0c2"/></svg>
      <h1>Nothing needs you right now</h1>
      <p>When a run stops for a person, it moves to the top of the list on the left with its reason and a live view of the screen.</p></div>`;
    return;
  }
  const st = stateOf(s), iv = s.intervention, mine = iv && iv.claimed_by === op();
  const feedPanel = `<section class="panel"><h2>${s.finished ? "What happened" : "Activity"}</h2>
    <ol class="feed" id="feed"></ol></section>`;
  if (s.finished) {
    d.style.setProperty("--c", st.color);
    d.innerHTML = `<div class="head"><div><h1>${s.kind === "discovery" ? "Discovery" : "Replay"} finished</h1>
      <div class="sub">${wrapId(s.label)}, session ${esc(s.id)}</div>
      <span class="outcome">${esc(st.short)}</span></div></div>
      <div style="max-width:760px">${feedPanel}</div>`;
    renderFeed();
    return;
  }
  const ctx = (iv && iv.context) || {};
  const facts = [
    ["Run", s.kind === "discovery" ? "Discovery" : "Replay"],
    ["Session", s.id],
    ctx.goal && ["Goal", ctx.goal],
    ctx.step && ["Step", `${ctx.step}${ctx.intent ? `: ${ctx.intent}` : ""}`],
    ctx.state && ["Detected state", ctx.state],
    iv && ["Raised", ago(iv.created_at)],
    iv && iv.claimed_by && ["Claimed by", iv.claimed_by],
  ].filter(Boolean);

  const actions = !iv ? `<p class="hint">Automation is working. You can watch; controls unlock if it asks for help.</p>`
    : !iv.claimed_by ? `<button class="btn primary wide" data-act="claim">Take control of this session</button>
        <p class="hint">Only one person can hold control. Automation stays paused while you do.</p>`
    : !mine ? `<p class="hint">${esc(iv.claimed_by)} has control of this session.</p>`
    : `<label for="note" class="hint">Note for the run log (optional)</label>
       <input id="note" class="note" placeholder="e.g. entered supervisor override">
       <div class="stack">${iv.allowed_resolutions.map((a) => {
         const r = RESOLUTIONS[a] || { text: a };
         return `<button class="btn ${r.primary ? "primary" : ""} ${r.danger ? "danger" : ""} wide" data-act="release" data-res="${a}">${r.text}</button>`;
       }).join("")}</div>`;

  const actionsLog = iv && iv.human_actions.length ? `<section class="panel"><h2>What you did</h2><ul class="log">${
    iv.human_actions.slice().reverse().map((a) => `<li><time>${new Date(a.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}</time>
      <span>${describe(a)}<br><span class="src">${a.source === "page" ? "seen in the page" : "sent from this console"}</span></span></li>`).join("")
  }</ul></section>` : "";

  d.style.setProperty("--c", st.color);
  d.innerHTML = `
    ${error ? `<div class="banner" role="alert">${esc(error)}</div>` : ""}
    <div class="head"><div><h1>${iv ? esc(iv.reason) : wrapId(s.label)}</h1>
      <div class="sub">${iv ? `${esc(KIND[iv.kind] || "Needs a person")} in ${wrapId(s.label)}` : `Session ${esc(s.id)}`}</div></div></div>
    ${track(s.controller)}
    <div class="work">
      <section>
        <div class="screen-wrap" style="position:relative">
          <div class="screen-bar"><span>${st.label}</span><span>${mine ? "Click the screen to click in the live session" : "Sensitive values are masked until you take control"}</span></div>
          <img class="screen ${mine ? "interactive" : ""}" id="screen" alt="Live view of the session's browser">
        </div>
        ${mine ? `<form class="typer" id="typer"><label class="visually-hidden" for="typed">Text to type</label>
            <input id="typed" autocomplete="off" placeholder="Type into the focused field"><button class="btn" type="submit">Type</button></form>
          <div class="keys">${["Tab", "Enter", "Backspace", "Escape"].map((k) => `<button class="btn" data-act="key" data-key="${k}">${k}</button>`).join("")}</div>
          <p class="hint">What you type is sent to the page and logged as a length, never as text.</p>` : ""}
      </section>
      <aside>
        <section class="panel">
          <h2>Details</h2>
          <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
          ${ctx.recent_actions && ctx.recent_actions.length ? `<ol class="recent">${ctx.recent_actions.map((a) => `<li>${esc(a)}</li>`).join("")}</ol>` : ""}
        </section>
        <section class="panel">${actions}</section>
        ${actionsLog}
        ${feedPanel}
      </aside>
    </div>`;
  renderFeed();
  refreshScreen();
}

function renderFeed() {
  const el = $("#feed"), f = feeds[selected];
  if (!el) return;
  if (!f || !f.items.length) { el.outerHTML = '<p class="feed-empty" id="feed">Waiting for the first step…</p>'; return; }
  if (el.tagName !== "OL") { el.outerHTML = '<ol class="feed" id="feed"></ol>'; return renderFeed(); }
  el.innerHTML = f.items.map((i) => `<li data-tone="${i.tone}"><span class="pt"></span><span>${esc(i.text)}</span></li>`).join("");
  el.scrollTop = el.scrollHeight;
}

async function loadFeed() {
  if (!selected) return;
  const f = feeds[selected] || (feeds[selected] = { seq: 0, items: [] });
  try {
    const items = await api(`/api/sessions/${selected}/activity?after=${f.seq}`);
    if (!items.length) return;
    f.items.push(...items);
    f.seq = Math.max(f.seq, ...items.map((i) => i.seq || 0));
    renderFeed();
  } catch { /* session gone; next poll re-selects */ }
}

function describe(a) {
  const d = a.detail || {};
  if (a.kind === "type") return `Typed ${d.length} character${d.length === 1 ? "" : "s"}`;
  if (a.kind === "press") return `Pressed ${esc(d.key)}`;
  if (a.kind === "fill") return `Filled ${esc(d.name || d.field_name || "a field")} (${d.length ?? 0} characters)`;
  if (a.kind === "select") return `Chose ${esc(d.option)} in ${esc(d.name || "a list")}`;
  if (a.kind === "click" && d.name) return `Clicked ${esc(d.role || "")} “${esc(d.name)}”`;
  if (a.kind === "click") return `Clicked at ${d.x}, ${d.y}`;
  return esc(a.kind);
}

function refreshScreen() {
  const img = $("#screen");
  if (!img || !selected) return;
  const next = new Image();
  next.onload = () => { const cur = $("#screen"); if (cur) cur.src = next.src; };
  next.src = `/api/sessions/${selected}/screen?operator=${encodeURIComponent(op())}&t=${Date.now()}`;
}

async function poll() {
  try {
    sessions = await api("/api/sessions");
    $("#link").classList.remove("down"); $("#link-text").textContent = "Live";
  } catch {
    $("#link").classList.add("down"); $("#link-text").textContent = "Disconnected";
    return;
  }
  if (!sessions.some((s) => s.id === selected)) pinned = false;
  if (!pinned) {
    // Follow what matters: a run waiting for a person, else the newest live run, else the latest result.
    const live = sessions.filter((s) => !s.finished).sort((a, b) => new Date(b.started_at) - new Date(a.started_at));
    const pick = sessions.find((s) => s.controller === "awaiting_human") || live[0] || sessions.find((s) => s.finished);
    selected = pick ? pick.id : null;
  }
  renderQueue();
  const s = sessions.find((x) => x.id === selected);
  const sig = JSON.stringify([selected, s && s.controller, s && s.finished, s && s.intervention, error, op()]);
  const typing = document.activeElement && ["typed", "note"].includes(document.activeElement.id);
  if (sig !== lastSig && !typing) { lastSig = sig; renderDetail(); }
  loadFeed();
}

async function act(fn) {
  try { error = ""; await fn(); } catch (e) { error = e.message; }
  lastSig = ""; await poll();
}

document.addEventListener("click", async (e) => {
  const sessionBtn = e.target.closest(".session");
  if (sessionBtn) { selected = sessionBtn.dataset.id; pinned = true; error = ""; lastSig = ""; return poll(); }
  const s = sessions.find((x) => x.id === selected);
  const iv = s && s.intervention;
  if (e.target.id === "screen" && iv && iv.claimed_by === op()) {
    const img = e.target, r = img.getBoundingClientRect(), wrap = img.parentElement.getBoundingClientRect();
    const x = (e.clientX - r.left) * (img.naturalWidth / r.width);
    const y = (e.clientY - r.top) * (img.naturalHeight / r.height);
    const dot = document.createElement("span");
    dot.className = "ripple"; dot.style.left = `${e.clientX - wrap.left}px`; dot.style.top = `${e.clientY - wrap.top}px`;
    img.parentElement.appendChild(dot); setTimeout(() => dot.remove(), 600);
    await act(() => api(`/api/sessions/${s.id}/click`, { operator: op(), x, y }));
    return setTimeout(refreshScreen, 300);
  }
  const btn = e.target.closest("[data-act]");
  if (!btn || !iv) return;
  const a = btn.dataset.act;
  if (a === "claim") await act(() => api(`/api/interventions/${iv.id}/claim`, { operator: op() }));
  if (a === "key") { await act(() => api(`/api/sessions/${s.id}/press`, { operator: op(), key: btn.dataset.key })); setTimeout(refreshScreen, 300); }
  if (a === "release") {
    const note = ($("#note") || {}).value || "";
    await act(() => api(`/api/interventions/${iv.id}/release`, { operator: op(), action: btn.dataset.res, note }));
  }
});

document.addEventListener("submit", async (e) => {
  if (e.target.id !== "typer") return;
  e.preventDefault();
  const s = sessions.find((x) => x.id === selected), input = $("#typed");
  if (!s || !input.value) return;
  const text = input.value; input.value = "";
  await act(() => api(`/api/sessions/${s.id}/type`, { operator: op(), text }));
  setTimeout(refreshScreen, 300);
});

$("#op").addEventListener("change", () => { lastSig = ""; poll(); });
poll();
setInterval(poll, 1000);
setInterval(refreshScreen, 1200);
</script>
</body>
