# Install once with `make install` (runs `pre-commit install`).
exclude: (^|/)evidence/  # generated run evidence is kept byte-exact
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8  # keep in sync with the ruff version in uv.lock
    hooks:
      - id: ruff-format  # the hooks already pass --force-exclude, so pyproject excludes apply
      - id: ruff-check
        args: [--fix]
