version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # One entry per assessment folder.
  - package-ecosystem: uv
    directory: /interface-ai
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /interface-ai
    schedule:
      interval: monthly
